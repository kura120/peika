<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme preview</title>
    <style>
      body { margin: 0; background: #888; font-family: system-ui, "Segoe UI", sans-serif; }
      #panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px; align-items: start; }
      @media (max-width: 1100px) { #panels { grid-template-columns: minmax(0, 1fr); } }
      .panel { min-width: 0; background: var(--surface); color: var(--text); border-radius: var(--r-card); padding: 20px 24px 28px; }
      .panel h1 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
      .panel h2 { margin: 28px 0 10px; font-size: 13.5px; font-weight: 600; }
      .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
      .swatch { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
      .swatch i { flex: none; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); }
      .swatch code { display: block; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--text-muted); }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
      .row > .label { flex: none; width: 90px; font-size: 12.5px; color: var(--text-muted); }
      /* Four equal state columns that may shrink (minmax 0), so a wide control
         such as the field is squeezed into its own column and never runs under
         the next one. Cells clip nothing but are allowed to be narrower than
         their content. */
      .states { display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); gap: 10px 10px; align-items: center; }
      .states > * { min-width: 0; }
      .states .head { font-size: 12.5px; color: var(--text-muted); }
      .states .pk-field { width: 100%; }
      .dots { display: flex; flex-wrap: wrap; gap: 8px; }
      .dots figure { margin: 0; padding: 6px 4px 8px; border: 1px solid var(--border-soft); border-radius: var(--r-row); text-align: center; font-size: 12.5px; color: var(--text-muted); }
      .dots figure svg { margin: 0 auto; }
      .desk { background: var(--bg-desktop); border-radius: var(--r-line); padding: 0 0 40px; display: flex; justify-content: center; }
      .island { background: var(--surface); border-radius: var(--r-island); box-shadow: var(--shadow-island); padding: 10px 22px 12px; display: flex; align-items: center; }
      .agents { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13.5px; }
      .agents span { display: inline-flex; align-items: center; gap: 6px; }
      .roles { margin: 0; padding: 0; list-style: none; font-size: 13.5px; display: grid; gap: 4px; }
      .code-line { display: inline-block; background: var(--code); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div id="panels"></div>
    <script type="module" src="./theme-preview.ts"></script>
  </body>
</html>
